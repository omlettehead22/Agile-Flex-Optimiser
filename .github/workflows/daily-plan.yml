name: daily-plan
# Octopus publishes tomorrow's Agile prices around 16:00 UK time (sometimes later).
# Three tries; the planner skips quietly if prices are missing or today's plan already exists.
on:
  schedule:
    - cron: "45 15 * * *"
    - cron: "45 16 * * *"
    - cron: "45 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-plan

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agileflex plan
      - name: Commit the plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plans
          if git diff --cached --quiet; then
            echo "No new plan."
          else
            git commit -m "Charging plan for $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
