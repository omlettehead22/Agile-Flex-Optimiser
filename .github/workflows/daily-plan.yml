name: daily-plan
# Octopus publishes tomorrow's Agile prices around 16:00 UK time (sometimes later).
# Main trigger: cron-job.org calls workflow_dispatch at 16:15 and 17:15 UK time (see README), because
# GitHub's own schedule is best effort and in practice ran this workflow hours late. The schedule
# below stays on as a backup; once today's plan exists, scheduled runs stop in seconds and
# dispatched runs skip inside the planner. A plan made after 18:00 starts from the next half-hour.
on:
  schedule:
    - cron: "17,47 15-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-plan

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Already planned today?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "plans/archive/$(TZ=Europe/London date +%F).md" ]; then
            echo "Today's plan already exists."; echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.check.outputs.done != 'true'
        run: pip install -r requirements.txt
      - if: steps.check.outputs.done != 'true'
        run: python -m agileflex plan
      - name: Commit the plan
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plans
          if git diff --cached --quiet; then
            echo "No new plan."
          else
            git commit -m "Charging plan for $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
